<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Tech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: rgb(226, 43, 134);
        }

        header {
            background-color: rgb(14, 28, 226);
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: chartreuse;
            border-radius: 8px;
        }

        h1, h2 {
            color: aquamarine;
        }

        .autor {
            font-style: italic;
            color: blanchedalmond;
        }

        /* Ajusta o tamanho das imagens para não estourarem a tela */
        article img {
            max-width: 20px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 10px 0;
        }
